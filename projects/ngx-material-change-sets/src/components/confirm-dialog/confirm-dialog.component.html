@if (data.title) {
    <h2 mat-dialog-title>{{data.title}}</h2>
}

<mat-dialog-content>
    @for (paragraph of data.paragraphs; track $index) {
        <p>{{paragraph}}</p>
    }
</mat-dialog-content>

<mat-dialog-actions>
    <button type="button" mat-raised-button class="confirm-button" (click)="confirm()">
        {{data.confirmButtonLabel}}
    </button>
    <button type="button" mat-raised-button class="cancel-button" (click)="cancel()">
        {{data.cancelButtonLabel}}
    </button>
</mat-dialog-actions>
